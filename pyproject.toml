[project]
name = "alchemyface"
version = "0.1.0"
description = "Face detection and recognition built on YuNet and SFace — a small, typed, dependency-light Python library."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Prashant Rawat", email = "prashantrawatmailbox@gmail.com" }]
keywords = ["face-recognition", "face-detection", "yunet", "sface", "opencv", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

# Deliberately minimal. Model weights are fetched at runtime rather than
# vendored, and everything the old prototype needed for its own deployment
# (SQLAlchemy, psycopg2, pgvector, pandas, scikit-learn, ultralytics, pygame)
# belongs to the application, not to this library.
dependencies = [
    # headless, not the GUI build: the package makes no imshow/waitKey calls, and
    # plain opencv-python needs libGL, which breaks CI, Docker and headless servers.
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.24,<3",
    "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/kouya-marino/AlchemyFace"
Repository = "https://github.com/kouya-marino/AlchemyFace"
Documentation = "https://github.com/kouya-marino/AlchemyFace#readme"
Issues = "https://github.com/kouya-marino/AlchemyFace/issues"

[project.scripts]
alchemyface = "alchemyface.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "alchemyface", from = "src" }]
# Keep the biometric quarantine and the developer scaffolding out of the sdist.
exclude = ["_local", "examples", "tests", "docs"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
pytest-sugar = "^1.0"
hypothesis = "^6.112"
mypy = "^1.11"
black = "^24.8"
isort = "^5.13"
pylint = "^3.2"
pip-licenses = "^5.0"
genbadge = {extras = ["coverage"], version = "^1.1.3"}
twine = "^7.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = { extras = ["python"], version = "^0.26" }

# Dependencies of examples/greeter/ only. Never shipped in the wheel.
[tool.poetry.group.greeter]
optional = true

[tool.poetry.group.greeter.dependencies]
sqlalchemy = "^2.0"
pgvector = "^0.3"
psycopg2-binary = "^2.9"
pygame = "^2.6"
pandas = "^2.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: requires the real ONNX weights on disk (skipped when absent)",
    "camera: requires an attached camera (skipped in CI)",
]

[tool.coverage.run]
source = ["src/alchemyface"]
branch = true

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["alchemyface"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

# cv2 ships partial stubs. Use the `FaceDetectorYN.create` / `FaceRecognizerSF.create`
# class-method form, which they declare; the module-level `*_create` aliases are not
# in the stubs. This override only silences a missing cv2 import, not attribute errors.
[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pylint.main]
# cv2 and numpy are C extensions. Without this pylint cannot see their members
# and reports no-member / not-an-iterable for calls that demonstrably work.
extension-pkg-allow-list = ["cv2", "numpy"]

[tool.pylint.typecheck]
generated-members = ["cv2.*", "numpy.*", "np.*"]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    # This package is built on typing.Protocol and small frozen value classes.
    # A one-method protocol is the design, not a smell.
    "R0903",  # too-few-public-methods
]

[tool.pylint.design]
# Recognizer and YuNetDetector take keyword-only configuration arguments.
max-args = 8

[tool.pylint.format]
max-line-length = 88

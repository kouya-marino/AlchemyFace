name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A repo-local git config does not travel with a clone, so a checkout on
  # another machine inherits that machine's global identity. This is the only
  # check that catches it, and it runs before anything can merge.
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On a pull_request event, checkout defaults to refs/pull/N/merge — a
          # synthetic commit GitHub authors itself as `noreply@github.com` and
          # the PR author's `…@users.noreply.github.com`. Walking that history
          # fails the guard on every PR. Check out the real head instead; on a
          # push event this expression falls back to github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject unexpected commit identities
        run: |
          ALLOWED='prashantrawatmailbox@gmail.com'
          # Authors are the contributors — this is the check that matters, and
          # it stays absolute.
          BAD=$(git log --format='%ae' | sort -u | grep -vx "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "::error::commits authored by someone other than ${ALLOWED}:"
            printf '  %s\n' $BAD
            exit 1
          fi
          # Committers may additionally be GitHub itself, because a merge made
          # with the merge button is always committed by `GitHub
          # <noreply@github.com>`. That is a mechanical fact about who applied
          # the commit, not a claim about who wrote it.
          BAD_C=$(git log --format='%ce' | sort -u \
                  | grep -vx "$ALLOWED" | grep -vx 'noreply@github.com' || true)
          if [ -n "$BAD_C" ]; then
            echo "::error::commits committed by an unexpected identity:"
            printf '  %s\n' $BAD_C
            exit 1
          fi
          echo "every commit is authored by ${ALLOWED}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests main.py
      - name: Ruff format check
        run: ruff format --check src tests main.py
      - name: Type check
        run: mypy src/alchemyface main.py

      # The README's PyPI badge is static, because the dynamic one showed a
      # version four releases behind: PyPI's JSON API lags after an upload,
      # shields.io caches it for three hours, and GitHub's proxy caches shields.
      # Static means it cannot be stale; this check means it cannot be forgotten.
      - name: README PyPI badge must match the declared version
        run: |
          DECLARED=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          BADGE=$(grep -oE 'PyPI-v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's/^PyPI-v//')
          echo "pyproject=${DECLARED}  README badge=${BADGE:-<none>}"
          if [ -z "$BADGE" ]; then
            echo "::error::no version-pinned PyPI badge found in README.md"
            exit 1
          fi
          if [ "$DECLARED" != "$BADGE" ]; then
            echo "::error::README PyPI badge says v${BADGE} but pyproject.toml declares ${DECLARED}"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"
      # opencv-python-headless needs no libGL, so there is nothing to apt-get.
      # This job is the fast path: no ONNX weights, no camera, no network, and
      # no display. A test with tkinter masked out proves it needs none.
      - name: Run tests
        run: pytest tests/ -m "not models and not camera and not gui"

  gui:
    name: gui (needs a display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # tkinter is a separate OS package on Debian, and Tk needs a display even
      # to construct a window. xvfb supplies a virtual one.
      - name: System packages for headless Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Confirm tkinter is importable
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # This job runs the display-free tests as well as the GUI ones, because
      # it is the only place the widget modules can be exercised — so it is
      # also the only place a coverage gate measures the real figure.
      - name: Run the full suite under xvfb, with coverage
        run: |
          xvfb-run -a pytest tests/ -m "not models and not camera" \
            --cov=src/alchemyface --cov-branch --cov-report term-missing \
            --cov-fail-under 85

  build:
    needs: [identity, lint, test, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # This repository holds face embeddings and voice recordings of real
      # people under _local/. They are git-ignored and pruned by MANIFEST.in,
      # but the build fails here rather than trusting that twice over.
      - name: Refuse to ship personal data
        run: |
          LISTING=$(mktemp)
          unzip -l dist/*.whl >> "$LISTING"
          tar tzf dist/*.tar.gz >> "$LISTING"
          if grep -iE '_local|face_data|sounds|id2map|eventlog|\.npy|\.npz|\.onnx|\.mp3|\.pt$' "$LISTING"; then
            echo "::error::the distribution contains personal data or model weights"
            exit 1
          fi
          echo "distribution is clean"

      # main.py is a checkout convenience. Packaging it would install a
      # top-level `main` module into site-packages, which is not ours to claim.
      - name: The root launcher must not be packaged
        run: |
          if unzip -l dist/*.whl | grep -qE ' main\.py$| main/'; then
            echo "::error::main.py leaked into the wheel as a top-level module"
            unzip -l dist/*.whl
            exit 1
          fi
          echo "the wheel claims no top-level main"

      - name: Verify the wheel imports and every entry point runs
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import alchemyface; print('import OK', alchemyface.__version__)"
          /tmp/smoke/bin/alchemyface version
          /tmp/smoke/bin/python -m alchemyface version
          # Run from /tmp, not the workspace: the checkout's own main.py sits in
          # the working directory and would be importable via sys.path[0],
          # making this pass or fail for reasons unrelated to the wheel.
          cd /tmp
          if python_out=$(/tmp/smoke/bin/python -c "import main; print(main.__file__)" 2>/dev/null); then
            echo "::error::the wheel installed a top-level main module at $python_out"
            exit 1
          fi
          echo "no top-level main installed, as intended"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
